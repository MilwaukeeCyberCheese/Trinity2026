name: Autofix Linting

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  spotless-apply:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          repository: ${{ github.event.workflow_run.head_repository.full_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check if linting failed
        id: check_lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh run view ${{ github.event.workflow_run.id }} --json jobs --jq '.jobs[] | select(.name == "Lint") | .conclusion')
          if [ "$CONCLUSION" != "failure" ]; then
            echo "Linting did not fail. Skipping autofix."
            echo "run_apply=false" >> $GITHUB_OUTPUT
          else
            echo "run_apply=true" >> $GITHUB_OUTPUT
          fi

      - name: Run spotlessApply
        if: steps.check_lint.outputs.run_apply == 'true'
        run: ./gradlew spotlessApply

      - name: Commit changes
        if: steps.check_lint.outputs.run_apply == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Apply Spotless (automatic commit)"
          branch: ${{ github.event.workflow_run.head_branch }}
